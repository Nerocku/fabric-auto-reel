name: Build Auto Reel Fabric
on: [push, workflow_dispatch]
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '25'}}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: '9.8.2'}}, {name: Build mod, run: gradle build --no-daemon}, {uses: actions/upload-artifact@v4, with: {name: autoreel-fabric-26.3, path: build/libs/*.jar}}]}}
